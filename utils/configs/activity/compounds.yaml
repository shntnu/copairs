# Phenotypic activity analysis for all compounds
# Corresponds to: 0.1.0.phenotypic-activity-compounds.py

data:
  path: "../profiles/profiles_var_mad_int_featselect_harmony.parquet"
  metadata_regex: "^Metadata"

preprocessing:
  # Filter for COMPOUND plates only
  - type: filter
    query: "Metadata_PlateType == 'COMPOUND'"
  
  # Remove features with NaN values
  - type: remove_nan_features
  
  # Filter out empty wells
  - type: filter
    query: "Metadata_JCP2022 != 'JCP2022_999999'"
  
  # Keep only treatments
  - type: filter
    query: "Metadata_control_type == 'trt'"

average_precision:
  params:
    pos_sameby: ["Metadata_JCP2022"]
    pos_diffby: []
    neg_sameby: []
    neg_diffby: ["Metadata_JCP2022"]
    batch_size: 20000
    distance: "cosine"

mean_average_precision:
  params:
    sameby: ["Metadata_JCP2022"]
    null_size: 20000
    threshold: 0.1
    seed: 12527

output:
  path: "output/phenotypic-activity-var_mad_int_featselect_harmony.csv.gz"
  save_ap_scores: false

plotting:
  enabled: false